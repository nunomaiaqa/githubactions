name: Cypress Cloud

on: 
 workflow_dispatch:
    inputs:
      spec:
        description: Run by cypress commad line
        default: cypress/e2e/*
        
jobs:
  cypress-e2e-electron:
    runs-on: ubuntu-latest
    container:
     image: cypress/browsers:node-24.14.0-chrome-145.0.7632.116-1-ff-148.0-edge-145.0.3800.70-1
     options: --user 1001
    steps:
      - name: Get code
        uses: actions/checkout@v6.0.2
        
      - name: Cypress run
        uses: cypress-io/github-action@v6.5.0
        with:
          install-command: yarn install
          browser: electron
          record: true
          group: UI Electron
          spec: ${{github.event.inputs.spec}}         
    env:
        CYPRESS_RECORD_KEY: ${{secrets.CYPRESS_RECORD_KEY}}
        GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
  cypress-e2e-chrome:
    needs: cypress-e2e-electron
    runs-on: ubuntu-latest
    container:
     image: cypress/browsers:node-24.14.0-chrome-145.0.7632.116-1-ff-148.0-edge-145.0.3800.70-1
     options: --user 1001
    steps:
      - name: Get code
        uses: actions/checkout@v6.0.2
        
      - name: Cypress run
        uses: cypress-io/github-action@v6.5.0
        with:
          install-command: yarn install
          browser: chrome
          record: true
          group: UI Chrome
          spec: ${{github.event.inputs.spec}}
         
    env:
        CYPRESS_RECORD_KEY: ${{secrets.CYPRESS_RECORD_KEY}}
        GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}         
  cypress-e2e-edge:
    needs: cypress-e2e-electron
    runs-on: ubuntu-latest
    container:
     image: cypress/browsers:node-24.14.0-chrome-145.0.7632.116-1-ff-148.0-edge-145.0.3800.70-1
     options: --user 1001
    steps:
      - name: Get code
        uses: actions/checkout@v6.0.2
        
      - name: Cypress run
        uses: cypress-io/github-action@v6.5.0
        with:
          install-command: yarn install
          browser: edge
          record: true
          group: UI Edge
          spec: ${{github.event.inputs.spec}}
         
    env:
        CYPRESS_RECORD_KEY: 22427bb6-3b71-40db-9524-4647a89c4671
        GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
       
