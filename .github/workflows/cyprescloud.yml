name: Cypress Cloud

on: 
 workflow_dispatch:
    inputs:
      spec:
        description: Run by cypress commad line
        default: cypress/e2e/*
        
jobs:
  cypress-e2e-electron:
    runs-on: ubuntu-latest
    steps:
      - name: Get code
        uses: actions/checkout@v6.0.2
        
      - name: Cypress run
        uses: cypress-io/github-action@v6.5.0
        with:
          install-command: yarn install
          browser: electron
          record: true
          group: UI Electron
          spec: ${{github.event.inputs.spec}}
         
    env:
        CYPRESS_RECORD_KEY: 5046b728-2726-4b4e-83b5-48c14b0ef5dc
        GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
         

       
