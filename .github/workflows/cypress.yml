name: Cypress Tests

on: 
  workflow_dispatch:
    inputs:
      cli:
        description: Run by cypress commad line
        default: yarn cypress run 

jobs:
  cypress-electron-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Get code
        uses: actions/checkout@v6.0.2

      - name: Install dependencies
        run: yarn install

      - name: Run e2e tests
        run: ${{ github.event.inputs.cli}}
